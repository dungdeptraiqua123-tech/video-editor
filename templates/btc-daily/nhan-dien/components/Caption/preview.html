<!-- @dsCard group="Phụ đề" height=360 width=1080 subtitle="Kiểu Phát sáng: chữ đang đọc đổi màu, phát sáng, phóng to 8%" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;800;900&display=swap">
<div class="stage">
  <div class="cap" id="cap"></div>
  <div class="legend">
    <span><i style="background:var(--caption-pending)"></i>Chưa đọc</span>
    <span><i style="background:var(--ink)"></i>Đã đọc</span>
    <span><i style="background:var(--sky)"></i>Từ khoá</span>
    <span><i style="background:var(--amber)"></i>Con số</span>
  </div>
</div>
<style>
  body { margin: 0; background: var(--night); }
  .stage { height: 360px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    background: linear-gradient(160deg, #3b3f48 0%, #23262e 55%, #12141a 100%); font-family: var(--font-brand); }
  .cap { display: flex; flex-direction: column; align-items: center; }
  .row { display: flex; gap: var(--space-word); }
  .w { font-size: 64px; font-weight: 800; line-height: 1.25; color: var(--caption-pending); text-shadow: var(--caption-shade);
    display: inline-block; transition: transform .18s cubic-bezier(.2,.9,.3,1.3), color .1s; }
  .w.said { color: var(--ink); }
  .w.said.kw { color: var(--sky); }
  .w.said.num { color: var(--amber); }
  .w.on { color: var(--sky); text-shadow: 0 3px 10px #000c, var(--glow-sky); transform: translateY(-5px) scale(1.08); }
  .w.on.num { color: var(--amber); text-shadow: 0 3px 10px #000c, var(--glow-amber); }
  .legend { display: flex; gap: 26px; color: var(--mute); font-size: 22px; font-weight: 600; }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 8px; vertical-align: -1px; }
  @media (prefers-reduced-motion: reduce) { .w { transition: none; } }
</style>
<script>
  const lines = [["Bitcoin", "đang", "giữ"], ["trên", "mốc", "86", "ngàn"]];
  const kw = new Set(["Bitcoin"]);
  const cap = document.getElementById("cap");
  const els = [];
  lines.forEach((ws) => {
    const row = document.createElement("div"); row.className = "row";
    ws.forEach((t) => { const s = document.createElement("span"); s.className = "w" + (kw.has(t) ? " kw" : "") + (/\d/.test(t) ? " num" : ""); s.textContent = t; row.appendChild(s); els.push(s); });
    cap.appendChild(row);
  });
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let i = still ? 5 : 0;
  const paint = () => els.forEach((e, k) => { e.classList.toggle("said", k <= i); e.classList.toggle("on", k === i); });
  paint();
  if (!still) setInterval(() => { i = (i + 1) % (els.length + 3); paint(); }, 420);
</script>
